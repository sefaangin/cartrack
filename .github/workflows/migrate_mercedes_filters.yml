name: Migrate Mercedes Filters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate_mercedes_filters.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Update config and baseline affected searches
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.parse import parse_qs, urlencode, urlparse
          import requests
          import watcher

          extra_path=Path('owner_extra_searches.json')
          extra=json.loads(extra_path.read_text(encoding='utf-8'))
          rows=list(extra.get('searches',[]))

          def change_price(url, stored_cap):
              p=urlparse(url)
              payload=json.loads(parse_qs(p.query)['search'][0])
              action=payload['action']
              action,n=re.subn(r'Price\.range\(\.\.\d+\)', f'Price.range(..{stored_cap})', action, count=1)
              if n != 1:
                  raise SystemExit('price range not found exactly once')
              payload['action']=action
              return 'https://car.encar.com/list/car?page=1&' + urlencode({'search':json.dumps(payload,ensure_ascii=False,separators=(',',':'))})

          w213=[x for x in rows if x.get('key')=='owner_w213']
          if len(w213) != 1:
              raise SystemExit('expected exactly one owner_w213')
          w213[0]['search_url']=change_price(w213[0]['search_url'],1500)  # legacy +100 => effective 16M

          def make_url(action,title):
              payload={'type':'car','action':action,'title':title,'toggle':{},'layer':'','sort':'MobileModifiedDate'}
              return 'https://car.encar.com/list/car?page=1&' + urlencode({'search':json.dumps(payload,ensure_ascii=False,separators=(',',':'))})

          additions=[
            {
              'key':'owner_c_w204_2014',
              'label':'Mercedes-Benz C-Class W204 2014',
              'search_url':make_url(
                '(And.Hidden.N._.MultiViewHidden.N._.SellType.일반._.(Or.Separation.B._.Separation.F.)_.ServiceCopyCar.ORIGINAL._.Mileage.range(..130000)._.Price.range(..700)._.(C.CarType.N._.(C.Manufacturer.벤츠._.(C.ModelGroup.C-클래스._.Model.C-클래스 W204.)))_.Year.range(201400..201499).)',
                'Mercedes-Benz C-Class W204 2014'
              )
            },
            {
              'key':'owner_c_w205_to_2016',
              'label':'Mercedes-Benz C-Class W205 <=2016',
              'search_url':make_url(
                '(And.Hidden.N._.MultiViewHidden.N._.SellType.일반._.(Or.Separation.B._.Separation.F.)_.ServiceCopyCar.ORIGINAL._.Mileage.range(..130000)._.Price.range(..700)._.(C.CarType.N._.(C.Manufacturer.벤츠._.(C.ModelGroup.C-클래스._.Model.C-클래스 W205.)))_.Year.range(201400..201699).)',
                'Mercedes-Benz C-Class W205 <=2016'
              )
            }
          ]
          existing={x.get('key') for x in rows}
          for add in additions:
              if add['key'] in existing:
                  raise SystemExit(f"search already exists: {add['key']}")
              rows.append(add)
          extra['searches']=rows
          extra_path.write_text(json.dumps(extra,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          base=json.loads(os.environ['SEARCHES_JSON'])
          merged=dict(base)
          merged['searches']=list(base['searches'])+rows
          os.environ['SEARCHES_JSON']=json.dumps(merged,ensure_ascii=False,separators=(',',':'))
          config=watcher.load_config()
          if len(config.searches) != 8:
              raise SystemExit(f'expected 8 total searches, got {len(config.searches)}')

          specs={s.key:s for s in config.searches}
          for key in ('owner_w213','owner_c_w204_2014','owner_c_w205_to_2016'):
              if key not in specs:
                  raise SystemExit(f'missing spec {key}')
          if 'Price.range(..1600)' not in specs['owner_w213'].action:
              raise SystemExit('W213 effective price cap is not 16M')
          for key in ('owner_c_w204_2014','owner_c_w205_to_2016'):
              a=specs[key].action
              if 'Price.range(..800)' not in a or 'Mileage.range(..130000)' not in a:
                  raise SystemExit(f'wrong price/mileage for {key}')
              if 'FuelType.' in a:
                  raise SystemExit(f'fuel filter unexpectedly present in {key}')
          if 'Year.range(201400..201499)' not in specs['owner_c_w204_2014'].action:
              raise SystemExit('W204 year filter wrong')
          if 'Year.range(201400..201699)' not in specs['owner_c_w205_to_2016'].action:
              raise SystemExit('W205 year filter wrong')

          secret=watcher.state_secret()
          old_state=watcher.decrypt_state(watcher.STATE_FILE.read_bytes(),secret)
          old_searches=old_state.get('searches',{})
          preserved={k:set(v.get('seen',[])) for k,v in old_searches.items() if isinstance(v,dict)}
          hkey=watcher.derive_key(secret,'cartrack-listing-hmac-v1')
          session=requests.Session(); watcher.bootstrap(session)
          counts={}

          for key in ('owner_w213','owner_c_w204_2014','owner_c_w205_to_2016'):
              listings=watcher.fetch_search(session,specs[key])
              hashes={watcher.digest_id(car['Id'],hkey) for car in listings}
              counts[key]=len(listings)
              if key=='owner_w213':
                  row=old_searches.setdefault(key,{'initialized':False,'seen':[],'fetch_failing':False,'delivery_failing':False})
                  row['seen']=sorted(set(row.get('seen',[])) | hashes)
              else:
                  old_searches[key]={
                    'initialized':True,
                    'seen':sorted(hashes),
                    'fetch_failing':False,
                    'delivery_failing':False,
                  }
              old_searches[key]['initialized']=True
              old_searches[key]['fetch_failing']=False
              old_searches[key]['delivery_failing']=False

          old_state['config_fingerprint']=watcher.config_fingerprint(config)
          watcher.save_state(old_state,secret)

          # Verify all pre-existing histories are retained.
          check=watcher.decrypt_state(watcher.STATE_FILE.read_bytes(),secret)
          for key,seen in preserved.items():
              current=set(check['searches'].get(key,{}).get('seen',[]))
              if not seen.issubset(current):
                  raise SystemExit(f'history lost for {key}')

          report={
            'status':'OK',
            'total_searches':len(config.searches),
            'w213_current_count':counts['owner_w213'],
            'w204_2014_baseline_count':counts['owner_c_w204_2014'],
            'w205_to_2016_baseline_count':counts['owner_c_w205_to_2016'],
            'existing_histories_preserved':True,
            'w213_effective_price_cap_krw':16000000,
            'c_effective_price_cap_krw':8000000,
            'c_max_mileage_km':130000,
            'c_fuel_filter':None
          }
          Path('.state/mercedes-filter-migration-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner_extra_searches.json
          git commit -m 'update Mercedes monitoring filters'
          git pull --rebase origin main
          git push origin HEAD:main

          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.enc mercedes-filter-migration-report.json
          git commit -m 'baseline new Mercedes filters'
          git pull --rebase origin state
          git push origin HEAD:state
