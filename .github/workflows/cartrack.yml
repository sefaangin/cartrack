name: Cartrack

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: watch
        type: choice
        options:
          - watch
          - dry-run
          - telegram-test
  push:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'owner_extra_searches.json'
      - '.hourly-trigger'
      - '.github/workflows/cartrack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'owner_extra_searches.json'
      - '.github/workflows/cartrack.yml'

concurrency:
  group: cartrack-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.head_commit.message != 'hourly cartrack trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q watcher.py tests
      - run: python -m unittest discover -s tests -v

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'hourly cartrack trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile watcher.py

      - name: Run selected mode
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          HEALTHCHECK_URL: ${{ secrets.healthcheckurl }}
          HEALTHCHECK_SUCCESS_URL: ${{ secrets.healthcheck_success_url }}
          HEALTHCHECK_FAILURE_URL: ${{ secrets.healthcheck_failure_url }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          set -euo pipefail
          mode="watch"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          fi

          if [[ "$mode" != "telegram-test" && "${{ github.repository }}" == "sefaangin/cartrack" ]]; then
            python - <<'PY'
          import json, os
          base = json.loads(os.environ['SEARCHES_JSON'])
          extra = json.load(open('owner_extra_searches.json', encoding='utf-8'))
          if not isinstance(base.get('searches'), list) or not isinstance(extra.get('searches'), list):
              raise SystemExit('invalid search configuration')
          base['searches'] = base['searches'] + extra['searches']
          open('/tmp/cartrack-searches.json','w',encoding='utf-8').write(json.dumps(base, ensure_ascii=False, separators=(',',':')))
          PY
            export SEARCHES_JSON="$(cat /tmp/cartrack-searches.json)"
          fi

          if [[ "$mode" == "watch" ]]; then
            python - <<'PY'
          import logging
          import time
          import requests
          import watcher

          original_send_telegram = watcher.send_telegram
          logger = logging.getLogger("cartrack")

          watcher.API_HEADERS.update({
              "origin": "https://car.encar.com",
              "referer": "https://car.encar.com/",
              "x-requested-with": "XMLHttpRequest",
              "sec-fetch-site": "same-site",
              "sec-fetch-mode": "cors",
              "sec-fetch-dest": "empty",
          })

          def logged_send_telegram(text: str) -> None:
              logger.info("CARTRACK_NOTIFICATION_BEGIN\n%s\nCARTRACK_NOTIFICATION_END", text)
              original_send_telegram(text)

          def diagnostic_api_get(session, params):
              attempts = 3
              last_error = None
              for attempt in range(attempts):
                  try:
                      response = session.get(
                          watcher.API_URL,
                          params=params,
                          headers=watcher.API_HEADERS,
                          timeout=(8, 12),
                      )
                      body_sample = response.text[:240].replace("\n", " ").replace("\r", " ")
                      logger.info(
                          "ENCAR_API_RESPONSE attempt=%d status=%s url=%s body_sample=%s",
                          attempt + 1,
                          response.status_code,
                          response.url,
                          body_sample,
                      )
                      if response.status_code != 200:
                          raise RuntimeError(f"Search API HTTP {response.status_code}; body={body_sample}")
                      data = response.json()
                      if not isinstance(data, dict):
                          raise RuntimeError("Search API returned non-object JSON")
                      return data
                  except (requests.RequestException, ValueError, RuntimeError) as exc:
                      last_error = exc
                      logger.warning(
                          "ENCAR_API_ATTEMPT_FAILED attempt=%d/%d error_type=%s error=%s",
                          attempt + 1,
                          attempts,
                          type(exc).__name__,
                          exc,
                      )
                      if attempt < attempts - 1:
                          time.sleep(3 * (attempt + 1))
              raise RuntimeError(f"Search request failed after {attempts} attempts: {last_error}")

          watcher.send_telegram = logged_send_telegram
          watcher.api_get = diagnostic_api_get
          watcher.run_watch(dry_run=False)
          PY
          else
            python watcher.py "$mode"
          fi

      - name: Persist encrypted state
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watch') || (github.event_name == 'push' && github.event.head_commit.message == 'hourly cartrack trigger'))
        shell: bash
        run: |
          cd .state
          if [[ -z "$(git status --porcelain -- state.enc)" ]]; then
            echo 'Encrypted state unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state.enc
          git commit -m 'update runtime state'
          git pull --rebase origin state
          git push origin HEAD:state
