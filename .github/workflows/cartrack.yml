name: Cartrack

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: watch
        type: choice
        options:
          - watch
          - dry-run
          - telegram-test
  push:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'owner_extra_searches.json'
      - '.hourly-trigger'
      - '.github/workflows/cartrack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'owner_extra_searches.json'
      - '.github/workflows/cartrack.yml'

concurrency:
  group: cartrack-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.head_commit.message != 'hourly cartrack trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q watcher.py tests
      - run: python -m unittest discover -s tests -v

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'hourly cartrack trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile watcher.py

      - name: Run selected mode
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          HEALTHCHECK_URL: ${{ secrets.healthcheckurl }}
          HEALTHCHECK_SUCCESS_URL: ${{ secrets.healthcheck_success_url }}
          HEALTHCHECK_FAILURE_URL: ${{ secrets.healthcheck_failure_url }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          set -euo pipefail
          mode="watch"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          fi

          if [[ "$mode" != "telegram-test" && "${{ github.repository }}" == "sefaangin/cartrack" ]]; then
            python - <<'PY'
          import json, os
          base = json.loads(os.environ['SEARCHES_JSON'])
          extra = json.load(open('owner_extra_searches.json', encoding='utf-8'))
          if not isinstance(base.get('searches'), list) or not isinstance(extra.get('searches'), list):
              raise SystemExit('invalid search configuration')
          base['searches'] = base['searches'] + extra['searches']
          open('/tmp/cartrack-searches.json','w',encoding='utf-8').write(json.dumps(base, ensure_ascii=False, separators=(',',':')))
          PY
            export SEARCHES_JSON="$(cat /tmp/cartrack-searches.json)"
          fi

          if [[ "$mode" == "watch" ]]; then
            python - <<'PY'
          import json
          import logging
          import os
          import re
          import time
          from urllib.parse import quote

          from curl_cffi import requests as curl_requests
          import watcher

          logger = logging.getLogger("cartrack")
          original_process_search = watcher.process_search
          original_send_telegram = watcher.send_telegram
          browser_session = curl_requests.Session(impersonate=os.getenv("CARTRACK_CURL_IMPERSONATE", "chrome"))
          upstream = {"cloudfront_403": False, "page_probe_done": False}

          watcher.API_HEADERS.update({
              "origin": "https://car.encar.com",
              "referer": "https://car.encar.com/",
              "x-requested-with": "XMLHttpRequest",
              "sec-fetch-site": "same-site",
              "sec-fetch-mode": "cors",
              "sec-fetch-dest": "empty",
          })

          def logged_send_telegram(text: str) -> None:
              logger.info("CARTRACK_NOTIFICATION_BEGIN\n%s\nCARTRACK_NOTIFICATION_END", text)
              original_send_telegram(text)

          def describe_response(prefix, response):
              body_sample = response.text[:300].replace("\n", " ").replace("\r", " ")
              server = response.headers.get("server", "")
              x_cache = response.headers.get("x-cache", "")
              via = response.headers.get("via", "")
              logger.info(
                  "%s status=%s server=%s x_cache=%s via=%s body_sample=%s",
                  prefix,
                  response.status_code,
                  server,
                  x_cache,
                  via,
                  body_sample,
              )
              return " ".join([server, x_cache, via, body_sample]).lower()

          def search_page_url(spec):
              payload = {
                  "type": "car",
                  "action": spec.action,
                  "title": spec.label,
                  "toggle": {},
                  "layer": "",
                  "sort": spec.sort,
              }
              return "https://car.encar.com/list/car?page=1&search=" + quote(
                  json.dumps(payload, ensure_ascii=False, separators=(",", ":"))
              )

          def probe_direct_page(spec):
              if upstream["page_probe_done"]:
                  return
              upstream["page_probe_done"] = True
              try:
                  url = search_page_url(spec)
                  response = browser_session.get(
                      url,
                      headers=watcher.PAGE_HEADERS,
                      timeout=(8, 12),
                      allow_redirects=True,
                  )
                  describe_response("ENCAR_PAGE_RESPONSE", response)
                  ids = sorted(set(re.findall(r"(?:cars/detail/|carid=|\\\"Id\\\"\\s*:)\\s*(\\d{7,9})", response.text)))[:20]
                  logger.info("ENCAR_PAGE_IDS_FOUND count=%d sample=%s", len(ids), ids[:10])
              except Exception as exc:
                  logger.warning("ENCAR_PAGE_PROBE_FAILED error_type=%s error=%s", type(exc).__name__, exc)

          def diagnostic_api_get(session, params):
              attempts = 2
              last_error = None
              for attempt in range(attempts):
                  try:
                      response = browser_session.get(
                          watcher.API_URL,
                          params=params,
                          headers=watcher.API_HEADERS,
                          timeout=(8, 12),
                      )
                      marker = describe_response(f"ENCAR_API_RESPONSE attempt={attempt + 1}", response)
                      if response.status_code == 403 and (
                          "cloudfront" in marker or "the request could not be satisfied" in marker
                      ):
                          upstream["cloudfront_403"] = True
                      if response.status_code != 200:
                          raise RuntimeError(f"Search API HTTP {response.status_code}")
                      data = response.json()
                      if not isinstance(data, dict):
                          raise RuntimeError("Search API returned non-object JSON")
                      return data
                  except Exception as exc:
                      last_error = exc
                      logger.warning(
                          "ENCAR_API_ATTEMPT_FAILED attempt=%d/%d error_type=%s error=%s",
                          attempt + 1,
                          attempts,
                          type(exc).__name__,
                          exc,
                      )
                      if attempt < attempts - 1:
                          time.sleep(3 * (attempt + 1))
              raise RuntimeError(f"Search request failed after {attempts} attempts: {last_error}")

          def circuit_process_search(*args, **kwargs):
              spec = kwargs.get("spec") or args[3]
              if upstream["cloudfront_403"]:
                  probe_direct_page(spec)
                  logger.warning(
                      "Skipping %s because Encar CloudFront 403 was already detected in this run",
                      spec.label,
                  )
                  return None, True, False
              count, failed, changed = original_process_search(*args, **kwargs)
              if failed and upstream["cloudfront_403"]:
                  probe_direct_page(spec)
              return count, failed, changed

          watcher.send_telegram = logged_send_telegram
          watcher.api_get = diagnostic_api_get
          watcher.process_search = circuit_process_search

          try:
              watcher.run_watch(dry_run=False)
          except RuntimeError:
              if upstream["cloudfront_403"]:
                  logger.warning("Encar CloudFront 403 detected after browser-like request. State preserved.")
              else:
                  raise
          PY
          else
            python watcher.py "$mode"
          fi

      - name: Persist encrypted state
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watch') || (github.event_name == 'push' && github.event.head_commit.message == 'hourly cartrack trigger'))
        shell: bash
        run: |
          cd .state
          if [[ -z "$(git status --porcelain -- state.enc)" ]]; then
            echo 'Encrypted state unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state.enc
          git commit -m 'update runtime state'
          git pull --rebase origin state
          git push origin HEAD:state
