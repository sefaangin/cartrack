name: One-time Encar API probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-encar-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check Encar API read-only
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import watcher
          from curl_cffi import requests as curl_requests
          if not os.environ.get('SEARCHES_JSON'):
              print('PROBE_ERROR missing searchesjson secret')
              raise SystemExit(2)
          spec = watcher.load_config().searches[0]
          params = {'count':'true','q':spec.action,'sr':f'|{spec.sort}|0|10'}
          headers = dict(watcher.API_HEADERS)
          headers.update({'origin':'https://car.encar.com','referer':'https://car.encar.com/','x-requested-with':'XMLHttpRequest'})
          client=curl_requests.Session(impersonate='chrome')
          for suffix in ('general','premium'):
              url=f'https://api.encar.com/search/car/list/{suffix}'
              try:
                  r=client.get(url,params=params,headers=headers,timeout=30)
                  content_type=r.headers.get('content-type','')[:80]
                  try:
                      data=r.json()
                      keys=sorted(list(data.keys()))[:12] if isinstance(data,dict) else []
                      items=data.get('SearchResults') if isinstance(data,dict) else None
                      count=len(items) if isinstance(items,list) else -1
                      declared=data.get('Count') if isinstance(data,dict) else None
                      print(f'PROBE_RESULT endpoint={suffix} http={r.status_code} content_type={content_type} entries={count} total={declared} keys={keys}')
                  except Exception:
                      print(f'PROBE_RESULT endpoint={suffix} http={r.status_code} content_type={content_type} json=no')
              except Exception as e:
                  print(f'PROBE_RESULT endpoint={suffix} exception={type(e).__name__}')
          PY
