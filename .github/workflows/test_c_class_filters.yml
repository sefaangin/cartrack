name: Test C-Class Filters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test_c_class_filters.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test filters
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          import watcher

          qs = {
            'w204_2014': '(And.Hidden.N._.MultiViewHidden.N._.SellType.일반._.(Or.Separation.B._.Separation.F.)_.ServiceCopyCar.ORIGINAL._.Mileage.range(..130000)._.Price.range(..800)._.(C.CarType.N._.(C.Manufacturer.벤츠._.(C.ModelGroup.C-클래스._.Model.C-클래스 W204.)))_.Year.range(201400..201499).)',
            'w205_to_2016': '(And.Hidden.N._.MultiViewHidden.N._.SellType.일반._.(Or.Separation.B._.Separation.F.)_.ServiceCopyCar.ORIGINAL._.Mileage.range(..130000)._.Price.range(..800)._.(C.CarType.N._.(C.Manufacturer.벤츠._.(C.ModelGroup.C-클래스._.Model.C-클래스 W205.)))_.Year.range(201400..201699).)',
          }
          session=requests.Session(); watcher.bootstrap(session)
          out={}
          for key,q in qs.items():
            d=watcher.api_get(session,{'count':'true','q':q,'sr':'|MobileModifiedDate|0|100'})
            rows=d.get('SearchResults',[])
            out[key]={
              'Count':d.get('Count'),
              'results_len':len(rows),
              'samples':[
                {'Id':x.get('Id'),'Model':x.get('Model'),'Badge':x.get('Badge'),'FormYear':x.get('FormYear'),'Mileage':x.get('Mileage'),'Price':x.get('Price')}
                for x in rows[:10]
              ]
            }
          Path('.state/c-class-filter-test.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c-class-filter-test.json
          git commit -m 'temporary C-Class filter test'
          git push origin HEAD:state
